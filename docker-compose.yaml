services:
  contapp-frontend:
    image: jeserna/contapp-frontend:latest
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=PathPrefix(`/`)"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"
    container_name: contapp-frontend
    restart: unless-stopped
