services:
  contapp-frontend:
    image: jeserna/contapp-frontend:v0.0.1180
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.contapp-frontend.entrypoints=web"
      - "traefik.http.routers.contapp-frontend.rule=PathPrefix(`/`)"
      - "traefik.http.services.contapp-frontend.loadbalancer.server.port=80"
    container_name: contapp-frontend
    restart: unless-stopped
    networks:
      - dokploy-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost/"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s
      start_interval: 10s
networks:
  dokploy-network:
    external: true
