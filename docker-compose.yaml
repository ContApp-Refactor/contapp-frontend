services:
  contapp-frontend:
    image: jeserna/contapp-frontend:latest
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.contapp-frontend.rule=PathPrefix(`/`)"
      - "traefik.http.services.contapp-frontend.loadbalancer.server.port=80"
    container_name: contapp-frontend
    restart: unless-stopped
    networks:
      - dokploy-network

networks:
  dokploy-network:
    external: true
