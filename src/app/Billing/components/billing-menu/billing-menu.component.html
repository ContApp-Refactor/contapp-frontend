<!-- Menú principal de Facturación: accesos arriba (botones estándar del proyecto) y borradores pendientes debajo -->
<div class="flex w-full h-full font-titillium">
  <div class="m-10 w-full font-medium bg-white rounded-3xl p-10">
    <div class="flex flex-wrap items-end gap-16 mb-20">
      <div>
        <h1 class="font-family-titillium font-bold text-3xl/41 text-primary inline-block">
          <span class="border-b-4 border-secondary-light inline-block pb-1">Facturación</span>
        </h1>
        <p class="font-family-sans font-normal text-sm mt-12">
          Selecciona la operación de facturación que deseas realizar.
        </p>
      </div>

      <!-- Mismo estilo de botones que el listado de empresas -->
      <div class="flex flex-wrap gap-3 ml-auto">
        @for (option of options; track option.route) {
          <p-button [label]="option.title" [icon]="option.icon" (click)="navigateTo(option.route)"></p-button>
        }
      </div>
    </div>

    <!-- Tabla de borradores pendientes (misma lógica de "Continuar factura pendiente") -->
    <app-sale-invoice-pending [embedded]="true" />
  </div>
</div>
