@if (visible$ | async) {
  <div
    class="loading-overlay"
    role="status"
    aria-live="polite"
    aria-busy="true"
    aria-label="Cargando, por favor espera"
  >
    <div class="loading-overlay__card">
      <div class="loading-overlay__logo-wrap">
        <img
          src="logo_unicauca.png"
          alt="Logo Universidad del Cauca"
          class="loading-overlay__logo"
        />
        <span class="loading-overlay__ring" aria-hidden="true"></span>
      </div>
      <p class="loading-overlay__text">Cargando<span class="loading-overlay__dots" aria-hidden="true"><span>.</span><span>.</span><span>.</span></span></p>
    </div>
  </div>
}
