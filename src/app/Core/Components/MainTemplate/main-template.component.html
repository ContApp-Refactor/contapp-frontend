<div class="flex flex-col min-h-screen bg-white">
  <app-side-nav-bar
    (onToggleSideNav)="onSidebarToggle($event)"
    *ngIf="collapsed || screenWidth > 1024"
  ></app-side-nav-bar>

  <!-- El shell (header + contenido) arranca donde termina el menú: el menú
       ocupa x=0..ancho, el header queda recortado a ese ancho esté abierto o
       cerrado, y el contenido nunca queda debajo. Mismo modelo en móvil y en
       desktop, por eso el menú llega a y=0 en los dos. -->
  <div
    class="flex flex-col flex-1 transition-all duration-500"
    [style.marginLeft.px]="shellOffset"
  >
  <!-- Header -->
    <app-header
      [showMenuToggle]="showMenuToggle"
      [menuOpen]="collapsed"
      (menuToggle)="collapsed = !collapsed"
    ></app-header>
    <!-- Main content area con altura calculada -->
    <!-- El header vive en el flujo (sticky), así que ocupa sus 90px acá y
         no hace falta el mt-60 que compensaba un header fijo fuera de flujo. -->
    <main class="flex-grow p-6 md:p-8">
      <div class="lg:m-20 p-10">
        <div class="mx-auto h-full w-full max-w-7xl mb-6">
          <div class="p-4 md:p-6">
            <app-bread-crumb></app-bread-crumb>
          </div>
        </div>
        <div class="mx-auto h-full w-full max-w-7xl">
          <router-outlet></router-outlet>
        </div>
      </div>
    </main>

    <app-footer></app-footer>
  </div>
</div>
