<body class="register-page">
    <!-- Encabezado: Logo y título -->
    <div class="register-header">
      <!-- [UNICAUCA] <img src="logo_unicauca.png" alt="Logo Unicauca" class="logo" /> -->
<img src="logo-default.svg" alt="ContApp" class="logo">
      <div class="header-divider"></div>
      <span class="app-title">ContApp</span>
    </div>

    <!-- Contenido principal -->
    <div class="main-content">
      <!-- Formulario: ocupa la mitad izquierda -->
      <div class="register-form-container">
        <div class="register-form">
          <h2 class="register-title">Registro de usuario</h2>
          <form [formGroup]="registerForm" (submit)="onSubmit()" class="form">
            <!-- Username -->
            <div class="form-group">
              <label for="username" class="registerfields">
                Usuario <span class="required">*</span>
              </label>
              <div class="input-container">
                <input
                  type="text"
                  id="username"
                  placeholder="usuario"
                  required
                  formControlName="username"
                />
                <span class="input-icon pi pi-user"></span>
              </div>
            </div>
            <!-- Email -->
            <div class="form-group">
              <label for="email" class="registerfields">
                Correo institucional <span class="required">*</span>
              </label>
              <div class="input-container">
                <!-- [UNICAUCA] placeholder original: usuario@unicauca.edu.co -->
                <input
                  type="email"
                  id="email"
                  placeholder="usuario@unicaucacontapp.app"
                  required
                  formControlName="email"
                />
                <span class="input-icon pi pi-envelope"></span>
              </div>
            </div>
            <!-- First Name -->
            <div class="form-group">
              <label for="firstName" class="registerfields">
                Nombres <span class="required">*</span>
              </label>
              <div class="input-container">
                <input
                  type="text"
                  id="firstName"
                  placeholder="Nombres"
                  required
                  formControlName="firstName"
                />
                <span class="input-icon pi pi-id-card"></span>
              </div>
            </div>
            <!-- Last Name -->
            <div class="form-group">
              <label for="lastName" class="registerfields">
                Apellidos <span class="required">*</span>
              </label>
              <div class="input-container">
                <input
                  type="text"
                  id="lastName"
                  placeholder="Apellidos"
                  required
                  formControlName="lastName"
                />
                <span class="input-icon pi pi-id-card"></span>
              </div>
            </div>
            <!-- Password -->
            <div class="form-group">
              <label for="password" class="registerfields">
                Contraseña <span class="required">*</span>
              </label>
              <div class="input-container">
                <input
                  type="password"
                  id="password"
                  placeholder="**********"
                  required
                  formControlName="password"
                />
                <span class="input-icon pi pi-lock"></span>
              </div>
            </div>
            <!-- Botón registrar -->
            <div class="form-submit">
              <button type="submit" [disabled]="registerForm.invalid">
                Registrarse
              </button>
            </div>
            <div class="existing-user-text">
              ¿Ya tienes cuenta?
              <a routerLink="/login" class="login-link">
                <span>Inicia sesión aquí</span>
              </a>
            </div>
          </form>
        </div>
      </div>
      <!-- Imagen derecha: ocupa la mitad derecha -->
      <div class="register-image">
        <!-- [UNICAUCA] <img src="unicauca-economia.jpg" alt="Edificio Unicauca" /> -->
<!-- [CONTAPP] foto institucional retirada por dominio propio -->
      </div>
    </div>

    <!-- Línea de colores -->
    <div class="color-strip">
      <div class="color-red"></div>
      <div class="color-orange"></div>
      <div class="color-yellow"></div>
      <div class="color-blue"></div>
