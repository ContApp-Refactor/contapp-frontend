<!-- Contenido completo del archivo -->
<p-dialog [header]="'Recibos aplicados a la Factura #' + invoiceId" 
          [(visible)]="isDialogVisible" 
          [modal]="true" 
          [style]="{ width: '90vw', maxWidth: '720px' }" 
          (onHide)="close()">

    <div class="p-4">
        <!-- Estado de Carga -->
        <div *ngIf="isLoading" class="flex justify-center items-center h-40">
            <p-progressSpinner></p-progressSpinner>
        </div>

        <!-- Tabla de Recibos -->
        <div *ngIf="!isLoading">
            <p-table [value]="receipts" styleClass="p-datatable-sm" responsiveLayout="scroll">
                <ng-template pTemplate="header">
                    <tr>
                        <th>Código del Recibo</th>
                        <th>Fecha del Recibo</th>
                        <th class="text-right">Monto Aplicado</th>
                        <!-- Nueva columna para acciones -->
                        <th class="text-center">Acciones</th>
                    </tr>
                </ng-template>
                <ng-template pTemplate="body" let-receipt>
                    <tr>
                        <td>{{ receipt.receiptCode }}</td>
                        <td>{{ receipt.issueDate | date:'dd/MM/yyyy' }}</td>
                        <td class="text-right">{{ receipt.amountPaid | currency:'$':'symbol':'1.0-0' }}</td>
                        <!-- Botón de redirección -->
                        <td class="text-center">
                            <p-button 
                                icon="pi pi-eye" 
                                styleClass="p-button-rounded p-button-text" 
                                pTooltip="Ver detalle del recibo"
                                (onClick)="viewReceiptDetails(receipt.id)">
                            </p-button>
                        </td>
                    </tr>
                </ng-template>
                <ng-template pTemplate="empty">
                    <tr>
                        <!-- Se actualiza el colspan a 4 -->
                        <td colspan="4" class="text-center py-6">
                            <p class="font-semibold">No se han registrado pagos para esta factura.</p>
                        </td>
                    </tr>
                </ng-template>
            </p-table>
        </div>
    </div>

    <ng-template pTemplate="footer">
        <p-button label="Cerrar" styleClass="p-button-secondary" (onClick)="close()"></p-button>
    </ng-template>
</p-dialog>
